name: Deploy Astro site to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Los libros de las palabras: los PDF de books/ se convierten aqui en
      # paginas para el flipbook (tools/books.py). Asi en el repo solo van
      # los PDF, y lo publicado siempre corresponde al PDF subido.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Convert word-book PDFs to flipbook pages
        run: |
          pip install pymupdf==1.28.2
          python tools/books.py --force

      - name: Install, build, and upload Site
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
